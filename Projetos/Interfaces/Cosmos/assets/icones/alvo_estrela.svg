<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e7d5ff"/>
      <stop offset="45%" stop-color="#a56cff"/>
      <stop offset="100%" stop-color="#5d2ab7"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer target circle -->
  <circle cx="60" cy="60" r="31"
          fill="none"
          stroke="url(#purple)"
          stroke-width="3"
          filter="url(#glow)"/>

  <!-- Cardinal markers -->
  <path d="M60 25 V36 M60 84 V95 M25 60 H36 M84 60 H95"
        fill="none"
        stroke="url(#purple)"
        stroke-width="3.2"
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Central four-point star -->
  <path d="M60 39
           L65 54
           L81 60
           L65 66
           L60 82
           L55 66
           L39 60
           L55 54 Z"
        fill="url(#purple)"
        stroke="#d8bfff"
        stroke-width="1"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Small surrounding stars/dots -->
  <circle cx="34" cy="34" r="3.5"
          fill="url(#purple)" filter="url(#glow)"/>
  <circle cx="86" cy="34" r="3.5"
          fill="url(#purple)" filter="url(#glow)"/>
  <circle cx="34" cy="86" r="3.5"
          fill="url(#purple)" filter="url(#glow)"/>
  <circle cx="86" cy="86" r="3.5"
          fill="url(#purple)" filter="url(#glow)"/>
</svg>