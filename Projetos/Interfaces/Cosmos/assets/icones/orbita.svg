<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="lavender" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7efff"/>
      <stop offset="45%" stop-color="#c9a9ff"/>
      <stop offset="100%" stop-color="#8c5de8"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main planet ring -->
  <circle cx="60" cy="60" r="34"
          fill="none"
          stroke="url(#lavender)"
          stroke-width="3.2"
          filter="url(#glow)"/>

  <!-- Diagonal orbital band -->
  <path d="M25 78 C38 87, 65 75, 94 42"
        fill="none"
        stroke="url(#lavender)"
        stroke-width="3.4"
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Small orbit continuation -->
  <path d="M25 78 C21 81, 20 85, 23 86 C27 87, 32 84, 36 80"
        fill="none"
        stroke="url(#lavender)"
        stroke-width="2.5"
        stroke-linecap="round"
        filter="url(#glow)"/>

  <!-- Top-left small celestial shape -->
  <path d="M22 29
           C18 26, 20 21, 25 21
           C29 21, 32 24, 31 27
           C36 25, 39 27, 38 30
           C37 33, 32 33, 29 31
           C29 36, 25 38, 23 35
           C21 33, 22 30, 22 29Z"
        fill="url(#lavender)"
        filter="url(#glow)"/>

  <!-- Top-right dot -->
  <circle cx="96" cy="28" r="4.2"
          fill="url(#lavender)"
          filter="url(#glow)"/>

  <!-- Bottom-right dot -->
  <circle cx="91" cy="94" r="4.1"
          fill="url(#lavender)"
          filter="url(#glow)"/>

  <!-- Subtle highlight -->
  <path d="M42 35 C48 29, 58 26, 67 27"
        fill="none"
        stroke="#ffffff"
        stroke-width="1"
        stroke-linecap="round"
        opacity=".75"/>
</svg>