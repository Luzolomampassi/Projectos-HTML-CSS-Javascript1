<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <radialGradient id="planet" cx="32%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#eadcff"/>
      <stop offset="38%" stop-color="#a875f5"/>
      <stop offset="72%" stop-color="#713bd0"/>
      <stop offset="100%" stop-color="#45209b"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d9b8ff"/>
      <stop offset="50%" stop-color="#8c4eea"/>
      <stop offset="100%" stop-color="#5b2bb5"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sphere">
      <circle cx="55" cy="60" r="31"/>
    </clipPath>
  </defs>

  <!-- Back part of the ring -->
  <ellipse cx="55" cy="64" rx="43" ry="15"
           transform="rotate(-12 55 64)"
           fill="none" stroke="url(#ring)" stroke-width="3"
           filter="url(#glow)"/>

  <!-- Planet -->
  <circle cx="55" cy="60" r="31"
          fill="url(#planet)"
          stroke="#b98cff" stroke-width="1.2"/>

  <!-- Soft planetary bands -->
  <g clip-path="url(#sphere)" opacity=".22">
    <path d="M20 48 C42 35 72 35 91 48 L91 58 C67 48 42 49 20 61Z"
          fill="#f1ddff"/>
    <path d="M18 76 C42 63 70 65 93 76 L93 88 C67 78 43 79 18 91Z"
          fill="#311478"/>
  </g>

  <!-- Front part of the ring -->
  <path d="M14 68
           C25 77 40 82 55 82
           C73 82 91 75 99 65"
        fill="none" stroke="url(#ring)" stroke-width="3.2"
        stroke-linecap="round" filter="url(#glow)"/>

  <!-- Highlight -->
  <ellipse cx="43" cy="43" rx="11" ry="7"
           transform="rotate(-25 43 43)"
           fill="#fff" opacity=".32"/>

  <!-- Small moon -->
  <circle cx="94" cy="25" r="6"
          fill="url(#planet)"
          stroke="#caa4ff" stroke-width="1"
          filter="url(#glow)"/>
</svg>