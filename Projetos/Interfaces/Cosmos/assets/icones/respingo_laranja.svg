<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffd0b8"/>
      <stop offset="42%" stop-color="#f39a72"/>
      <stop offset="100%" stop-color="#d96745"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Main abstract splash -->
  <path d="M57 24
           C61 17 67 18 67 26
           C67 33 64 39 69 40
           C75 39 83 30 89 28
           C94 27 96 31 92 36
           C87 42 79 47 82 50
           C85 53 94 49 98 53
           C102 57 97 61 90 63
           C83 65 78 65 80 70
           C82 76 91 77 91 82
           C90 88 82 88 76 83
           C70 78 67 74 64 78
           C60 83 64 93 58 96
           C52 98 49 91 49 84
           C49 77 47 73 43 75
           C37 79 32 87 27 85
           C22 82 25 75 30 70
           C35 64 39 61 35 58
           C30 55 21 59 18 54
           C15 49 22 45 29 43
           C37 41 42 41 41 36
           C40 31 34 29 36 24
           C38 19 45 21 49 26
           C52 29 54 28 57 24 Z"
        fill="url(#orange)"
        stroke="#f8b091"
        stroke-width="1"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner highlight -->
  <path d="M48 38 C55 34 62 35 67 39 C61 43 54 48 47 49"
        fill="none"
        stroke="#ffd9c7"
        stroke-width="2"
        stroke-linecap="round"
        opacity=".45"/>

  <!-- Floating droplets -->
  <circle cx="25" cy="27" r="4.8"
          fill="url(#orange)"
          filter="url(#glow)"/>
  <circle cx="91" cy="91" r="4.5"
          fill="url(#orange)"
          filter="url(#glow)"/>
</svg>